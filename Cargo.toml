[package]
name = "suitboot"
version = "0.0.1"
edition = "2024"
description = "Erase a USB stick on macOS and write a Linux ISO"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
owo-colors = "4.4.0"
plist = "1.10.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
